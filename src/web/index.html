<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Github-search · GitHub 项目发现漏斗</title>
<!--
  单文件界面（HTML + CSS + JS，零依赖、零构建）。

  为什么是单文件：这个项目整体零第三方依赖、不需要 npm install。
  界面拆成多个文件就要处理静态资源路由、缓存头、相对路径，
  而它只需要「跑一条命令，打开一个页面」。加起来 840 行，拆开反而更难改。

  三栏布局与数据来源：
    左栏  表单 → 提交后【原地切换】为运行日志（不跳页，因为日志要和进度同屏）
    中栏  统计 / 直方图 / 结果列表  ← /api/runs/:id 与 /api/results
    右栏  关键词扩词列表            ← /api/runs/:id 的 keywords 字段

  轮询模型（见文件末尾 tick / pollRun）：
    每 2 秒 GET /api/state 拿全局状态；若有在跑的任务，再串行拉 run 详情+结果。
    两级轮询是为了「没任务时只花 1 个请求」，而不是无脑全量拉。

  配色不是装饰，是状态语义（详见下面 :root 的注释）。
-->
<style>
/*
  设计令牌。分四组：底色、描边、文字、语义色。
  语义色不按「好看」挑，按「它代表什么」挑 —— 同一件事全站只用一种颜色：
    绿  正常 / 运行中 / 高分(>=0.75) / 达标日志
    红  故障 / 错误日志 / 停止 / 未连接
    琥珀 警告 / 中分 / 未配置提示
    蓝  主操作 / 链接 / 低分直方图
    紫  一切由 LLM 生成的东西（扩词来源）
    青  用户提供的东西（user 来源）/ 已打分数
  这样用户扫一眼颜色就知道「这条是谁产生的、是好是坏」，不必读文字。
  每色配一个 *Glow 变量专供 box-shadow 发光用，避免到处手写 rgba。
*/
:root{
  /* 底色：从最深的页面底到最亮的抬升面，四级足够做层次 */
  --bg:#080b0f; --bg2:#0c1016; --surface:#111721; --surface2:#161e2a; --surface3:#1c2533;
  /* 描边三级：line 分隔、line2 控件边框、line3 hover 态 */
  --line:#212b38; --line2:#2c3848; --line3:#3a4759;
  /*
    文字四级：主文、次文、弱化、最弱。
    【2026-10-20 修】原 --faint 是 #4a5765，对 #111721 只有 2.4:1、对 #080b0f 2.7:1，
    而它大量用于 9~10.5px 的计数和弱提示 —— 远低于正文 4.5:1 的门槛，实测看不清。
    提到 #6b7a89 后约 4.6:1；仍比 muted 弱，但小字读得出来了。
  */
  --fg:#e9eff7; --fg2:#b3c0ce; --muted:#71808f; --faint:#6b7a89;
  --green:#3fb950; --green2:#2ea043; --greenGlow:rgba(63,185,80,.42);
  --red:#f85149; --red2:#da3633; --redGlow:rgba(248,81,73,.42);
  --amber:#d29922; --amber2:#bb8009; --amberGlow:rgba(210,153,34,.38);
  --blue:#388bfd; --blue2:#1f6feb; --blueGlow:rgba(56,139,253,.42);
  --violet:#a371f7; --violetGlow:rgba(163,113,247,.35);
  --cyan:#39c5cf; --cyanGlow:rgba(57,197,207,.35);
  --r:9px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--fg);overflow:hidden;display:flex;flex-direction:column;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(56,139,253,.10), transparent 60%),
    radial-gradient(900px 540px at 88% 108%, rgba(163,113,247,.08), transparent 62%),
    linear-gradient(180deg,#0a0e14 0%,#080b0f 100%);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== 顶栏 ===== */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:11px 18px;
  background:linear-gradient(180deg,rgba(22,30,42,.92),rgba(15,20,28,.86));
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 4px 18px rgba(0,0,0,.42);
  backdrop-filter:blur(10px);position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;
  background:linear-gradient(145deg,#388bfd,#a371f7);color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.10) inset, 0 4px 12px rgba(56,139,253,.38);
}
.brand h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.25px}
.brand h1 em{font-style:normal;color:var(--muted);font-weight:400;font-size:11.5px;margin-left:9px}
header .sp{flex:1}

/* 状态胶囊 */
.badge{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:4px 12px;border-radius:20px;
  background:linear-gradient(180deg,rgba(28,37,51,.95),rgba(20,27,37,.95));
  border:1px solid var(--line2);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 8px rgba(0,0,0,.3);
  transition:.2s;
}
.badge.on{border-color:rgba(63,185,80,.45);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 0 14px var(--greenGlow)}
.badge.off{border-color:rgba(248,81,73,.45);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 0 14px var(--redGlow)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto;transition:.2s}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--greenGlow),0 0 2px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--redGlow),0 0 2px var(--red)}
.dot.warn{background:var(--amber);box-shadow:0 0 8px var(--amberGlow),0 0 2px var(--amber)}
.dot.live{animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}

/* ===== 按钮 ===== */
button{
  border-radius:7px;padding:7px 14px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:500;
  color:var(--fg);border:1px solid var(--line2);
  background:linear-gradient(180deg,#212b3a,#1a222e);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 2px 6px rgba(0,0,0,.32);
  transition:.15s;
}
button:hover:not(:disabled){border-color:var(--line3);background:linear-gradient(180deg,#28333f,#1f2836);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{opacity:.38;cursor:not-allowed}
button.pri{
  border-color:rgba(56,139,253,.55);font-weight:650;color:#fff;
  background:linear-gradient(180deg,#3d8ffd,#1f6feb);
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 4px 16px var(--blueGlow);
}
button.pri:hover:not(:disabled){background:linear-gradient(180deg,#4d9aff,#2d7ff9);box-shadow:0 1px 0 rgba(255,255,255,.26) inset,0 6px 22px var(--blueGlow)}
button.danger{
  color:#ffb1ab;border-color:rgba(248,81,73,.4);
  background:linear-gradient(180deg,rgba(60,22,24,.9),rgba(42,18,20,.9));
}
button.danger:hover:not(:disabled){border-color:rgba(248,81,73,.75);box-shadow:0 0 14px var(--redGlow);color:#ffd0cc}
button.wide{width:100%;padding:10px;font-size:13px;letter-spacing:.3px}
button.ghost{background:transparent;box-shadow:none;border-color:var(--line2)}

/* ===== 主栅格 ===== */
/*
  三栏栅格。左栏固定宽（表单字段宽度可预期），中栏吃剩余空间（minmax(0,1fr) 里的 0
  很关键：不写的话 min-content 会把长仓库名撑破栅格、逼出横向滚动条），右栏固定窄。
  min-height:0 同样是必须的 —— 没有它，内部 overflow:auto 的滚动区不会生效。
*/
main{flex:1;display:grid;grid-template-columns:356px minmax(0,1fr) 300px;min-height:0;position:relative;z-index:1}
/* 中等宽度：右栏（扩词）先让位 —— 它信息密度最低，可以整栏隐藏 */
@media(max-width:1200px){main{grid-template-columns:312px minmax(0,1fr)}#colRight{display:none}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
#colLeft{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(17,23,33,.72),rgba(12,16,22,.72))}
#colRight{border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(17,23,33,.72),rgba(12,16,22,.72))}
#colCenter{background:transparent}

.colhead{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 14px;
  font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:650;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(28,37,51,.5),rgba(20,27,37,.16));
  box-shadow:0 1px 0 rgba(255,255,255,.028) inset;
}
.colhead .sp{flex:1}
.colbody{flex:1;overflow:auto;min-height:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#232d3b;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#313d4f;background-clip:content-box}

/* ===== 表单 ===== */
.pad{padding:15px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:11px;color:var(--fg2);letter-spacing:.2px;display:flex;align-items:center;gap:7px;font-weight:500}
.f label .hint{color:var(--faint);font-weight:400;font-size:10.5px}
input,textarea,select{
  width:100%;border-radius:7px;padding:8px 10px;font:inherit;font-size:12.5px;color:var(--fg);
  background:linear-gradient(180deg,#0a0e14,#0d1218);
  border:1px solid var(--line2);
  box-shadow:0 1px 2px rgba(0,0,0,.35) inset;
  transition:.15s;
}
/* 占位符原 #3e4a58 对输入框底色只有 2.08:1，几乎不可读 —— 提到 #646f7d（约 4:1） */
input::placeholder,textarea::placeholder{color:#646f7d}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:rgba(56,139,253,.7);
  box-shadow:0 0 0 3px rgba(56,139,253,.14), 0 1px 2px rgba(0,0,0,.35) inset;
}
textarea{resize:vertical;font-family:inherit;line-height:1.55}
#kw{min-height:92px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* 默认参数条 */
.fixed-note{
  font-size:11px;color:var(--muted);line-height:1.7;padding:10px 12px;margin-bottom:14px;
  border-radius:8px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(28,37,51,.6),rgba(16,21,29,.6));
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
.fixed-note b{color:var(--cyan);font-weight:650;font-variant-numeric:tabular-nums}
.fixed-note .lbl{color:var(--fg2);font-weight:600}

/* 高级选项 */
/*
  这个折叠标题是 <button> 而不是 <div onclick> —— 原来键盘完全到不了（Tab 停在 goal 就跳走），
  高级选项对键盘用户等于不存在。用 button 天然拿到 Tab 焦点与 Enter/Space 触发。
  下面的重置样式是为了让它仍长得像一行标题，而不是一个按钮。
*/
.adv-toggle{
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12px;font-weight:500;
  color:var(--muted);padding:11px 0 9px;margin-top:6px;transition:.15s;
  background:none;box-shadow:none;border:none;border-top:1px solid var(--line);
  border-radius:0;width:100%;text-align:left;font-family:inherit;transform:none;
}
/*
  必须比全局 button:hover 更具体地重置。
  它是 <button>，会继承 button:hover:not(:disabled) 的渐变背景 + border-color + translateY(-1px)，
  于是鼠标一碰折叠标题就变成一个高亮按钮块（实测 transform: matrix(1,0,0,1,0,-1)），
  和 reset 后的"一行标题"外观自相矛盾。悬停只改文字颜色，保住标题观感。
*/
.adv-toggle:hover:not(:disabled){
  background:none;box-shadow:none;transform:none;
  border-color:transparent;border-top:1px solid var(--line);
  color:var(--fg);
}
.adv-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:5px}
.adv-toggle:hover{color:var(--fg)}
.adv-toggle .arw{display:inline-block;font-size:9px;transition:transform .18s;color:var(--faint)}
.adv-toggle.open .arw{transform:rotate(90deg);color:var(--blue)}
.adv-toggle.open{color:var(--fg2)}
#advBox{display:none;padding-top:6px;animation:slideIn .18s ease}
#advBox.open{display:block}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ===== 日志 ===== */
#logView{display:none;flex-direction:column;height:100%;min-height:0}
#logView.on{display:flex}
.logbar{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:11.5px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(28,37,51,.5),rgba(20,27,37,.12));
}
.logbody{flex:1;overflow:auto;padding:11px 12px;min-height:0;background:rgba(6,9,13,.55)}
.logline{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.68;
  color:#8fa0b2;white-space:pre-wrap;word-break:break-word;padding:.5px 0;
}
.logline.hi{color:var(--green);text-shadow:0 0 10px rgba(63,185,80,.25)}
.logline.err{color:var(--red)}
.logline.warn{color:var(--amber)}
.logline.kw{color:var(--violet)}

/* ===== 中栏 ===== */
#centerHead{
  flex:0 0 auto;position:relative;padding:14px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,27,37,.55),rgba(12,16,22,.25));
  box-shadow:0 1px 0 rgba(255,255,255,.028) inset;overflow:hidden;
}
.stats{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;position:relative;z-index:2}
/* 运行中的顶部流光进度条 */
#runbar{position:absolute;left:0;right:0;top:0;height:2px;overflow:hidden;opacity:0;transition:opacity .3s}
#runbar.on{opacity:1}
#runbar::before{
  content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,var(--green),var(--cyan),transparent);
  box-shadow:0 0 10px var(--greenGlow);
  animation:runslit 1.9s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes runslit{0%{left:-45%}100%{left:105%}}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-size:20px;line-height:1.18;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.75px}
#sQualified{color:var(--green);text-shadow:0 0 16px rgba(63,185,80,.3)}
#sScored{color:var(--cyan)}
#sScanned{color:var(--fg2)}
#sKw{color:var(--violet)}

/* 虚化大字 */
/*
  「搜索中 / 搜索完毕」虚化大字。刻意做到 4~14% 不透明度：
  它要传达状态，但不能和真正的数据（统计数字、结果行）抢注意力。
  运行中用呼吸动画 + 绿色发光放大到 14%，静止态压到 4.5%。
  放在统计条右侧而不是页面正中，是为了不遮挡结果列表的阅读动线。
*/
#ghost{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-size:38px;font-weight:800;letter-spacing:9px;pointer-events:none;user-select:none;
  color:var(--fg);opacity:.045;white-space:nowrap;z-index:1;
}
#ghost.live{color:var(--green);animation:breathe 3s ease-in-out infinite}
#ghost.done{color:var(--fg2);opacity:.07}
#ghost.fail{color:var(--red);opacity:.09}
/* B5：停止中用琥珀，与状态点同色。原来复用 .live（绿色），一个停止动作出现两种语义色 */
/*
  修 5：只改 color 不够 —— breathe 关键帧里写死了 --greenGlow，
  结果是"琥珀字 + 绿色光晕"。这里给 warn 单独一套 keyframes。
*/
#ghost.warn{color:var(--amber);opacity:.09;animation:breatheAmber 3s ease-in-out infinite}
@keyframes breatheAmber{
  0%,100%{opacity:.045;text-shadow:none}
  50%{opacity:.14;text-shadow:0 0 40px var(--amberGlow)}
}
@keyframes breathe{0%,100%{opacity:.045;text-shadow:none}50%{opacity:.14;text-shadow:0 0 40px var(--greenGlow)}}

/* 直方图 */
#histWrap{flex:0 0 auto;padding:14px 18px 8px;border-bottom:1px solid var(--line)}
.hist{display:flex;gap:5px;align-items:flex-end;height:74px;margin-bottom:3px}
/*
  .hcol 上的 height:100% 是必需的，不是随手写的。
  柱子用 height:<百分比>% 表示高度，而【百分比高度要求父元素有确定高度】。
  最初漏了这行，.hcol 被内容撑成"刚好包住柱子"，百分比就只能解析成 0，
  于是整排柱子退化成几根细线（已实测踩过）。
*/
.hcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.hbar{
  width:100%;border-radius:3px 3px 0 0;min-height:2px;transition:height .35s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(180deg,#4a9eff,#1f6feb);
  box-shadow:0 0 12px rgba(56,139,253,.28);
}
.hbar.hot{background:linear-gradient(180deg,#56d364,#2ea043);box-shadow:0 0 14px var(--greenGlow)}
.hbar.zero{background:#1b2431;box-shadow:none}
.hcnt{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35;min-height:13px}
.hlab{display:flex;gap:5px;margin-top:1px}
.hlab span{flex:1;text-align:center;font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums}
.histmeta{display:flex;gap:18px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.histmeta b{color:var(--fg);font-variant-numeric:tabular-nums}
.histmeta .g{color:var(--green)}

/* 结果列表 */
#results{flex:1;overflow:auto;min-height:0}
.hit{
  display:flex;gap:14px;align-items:flex-start;padding:12px 18px;
  border-bottom:1px solid rgba(33,43,56,.65);transition:background .13s,box-shadow .13s;
}
.hit:hover{background:rgba(28,37,51,.42);box-shadow:2px 0 0 var(--blue) inset}
.hit .rank{flex:0 0 26px;text-align:right;color:#39465a;font-size:11px;padding-top:5px;font-variant-numeric:tabular-nums}
.hit .sc{
  flex:0 0 48px;text-align:right;font-size:16px;font-weight:750;padding-top:1px;
  font-variant-numeric:tabular-nums;letter-spacing:-.4px;
}
.s-hi{color:var(--green);text-shadow:0 0 14px rgba(63,185,80,.28)}
.s-mid{color:var(--amber)}
.s-lo{color:var(--faint)}
.hit .body{flex:1;min-width:0}
.hit .name{font-size:13.5px;font-weight:620;margin-bottom:3px;line-height:1.35;overflow-wrap:anywhere}
/*
  overflow-wrap:anywhere 是必需的：GitHub 允许 owner/repo 总长 140 字符，
  实测这么一个合法名字会把 #results 撑出 1337px（容器只有 712~944px），
  结果区出现横向滚动、文字被右侧裁掉。加在 .name/.one 上即可，不必动容器。
*/
.hit .name a{color:var(--fg)}
.hit .name a:hover{color:var(--blue)}
.hit .one{color:var(--fg2);font-size:12.5px;line-height:1.58;margin-bottom:5px;overflow-wrap:anywhere}
.hit .meta{display:flex;gap:13px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.hit .meta i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.hit .meta .star{color:var(--amber)}

.empty{padding:60px 26px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.95}
.empty b{display:block;font-size:15px;color:var(--muted);font-weight:600;margin-bottom:7px;letter-spacing:.2px}
.empty .ico{font-size:26px;opacity:.35;margin-bottom:10px;display:block}

/* ===== 右栏扩词 ===== */
.kwi{padding:9px 13px;border-bottom:1px solid rgba(33,43,56,.6);transition:background .13s}
.kwi:hover{background:rgba(28,37,51,.4)}
.kwi .q{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;
  color:#c8d4e0;word-break:break-word;margin-bottom:4px;
}
.kwi .row2{display:flex;gap:7px;font-size:9.5px;color:var(--faint);align-items:center;flex-wrap:wrap}
.tag{
  font-size:9px;padding:1px 6px;border-radius:4px;font-weight:600;letter-spacing:.2px;
  border:1px solid var(--line2);color:var(--muted);background:rgba(28,37,51,.7);
}
.tag.d1{color:var(--cyan);border-color:rgba(57,197,207,.35);background:rgba(57,197,207,.09)}
.tag.d2{color:var(--violet);border-color:rgba(163,113,247,.35);background:rgba(163,113,247,.09)}
.tag.d3{color:#d2a8ff;border-color:rgba(163,113,247,.5);background:rgba(163,113,247,.14)}
/* 来源标签：llm 紫 / user 青 */
.tag.src-llm{color:var(--violet);border-color:rgba(163,113,247,.42);background:rgba(163,113,247,.10)}
.tag.src-user{color:var(--cyan);border-color:rgba(57,197,207,.42);background:rgba(57,197,207,.10)}
.tag.retired{color:var(--faint);border-color:var(--line)}
.kwi.dry .q{color:#4e5a68}
.kwi.dry .q::after{content:" · 无新结果";color:var(--faint);font-size:9.5px}

/* ===== 弹窗 ===== */
.mask{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(4,6,9,.72);backdrop-filter:blur(5px);
}
.mask.on{display:flex;animation:fadeIn .16s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:min(528px,92vw);max-height:88vh;overflow:auto;border-radius:13px;
  border:1px solid var(--line2);
  background:linear-gradient(180deg,#181f2b,#111721);
  box-shadow:0 0 0 1px rgba(255,255,255,.045), 0 28px 80px rgba(0,0,0,.72), 0 0 60px rgba(56,139,253,.09);
  animation:popIn .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes popIn{from{opacity:0;transform:scale(.965) translateY(8px)}to{opacity:1;transform:none}}
.modal h2{
  margin:0;display:flex;align-items:center;gap:10px;padding:16px 20px;font-size:14px;font-weight:650;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(56,139,253,.07),transparent);
}
.modal h2 .sp{flex:1}
.modal h2 .ic{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;
  background:linear-gradient(145deg,#388bfd,#a371f7);color:#fff;
  box-shadow:0 2px 10px var(--blueGlow);
}
.modal .bd{padding:18px 20px}
.modal .ft{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;
  border-top:1px solid var(--line);background:rgba(10,14,20,.5);
}
.modal .ft .sp{flex:1}
.x{border:none;background:none;box-shadow:none;color:var(--muted);font-size:17px;padding:2px 6px;line-height:1}
.x:hover{color:var(--fg);background:rgba(255,255,255,.06);transform:none}

.msg{display:none;margin-top:10px;padding:9px 12px;border-radius:7px;font-size:11.5px;line-height:1.6}
.msg.on{display:block}
.msg.ok{color:#7ee787;border:1px solid rgba(63,185,80,.4);background:rgba(63,185,80,.09);box-shadow:0 0 16px rgba(63,185,80,.09)}
.msg.bad{color:#ffa198;border:1px solid rgba(248,81,73,.42);background:rgba(248,81,73,.09)}
.msg.info{color:var(--fg2);border:1px solid var(--line2);background:rgba(28,37,51,.55)}
.msg.warn{color:#e3b341;border:1px solid rgba(210,153,34,.4);background:rgba(210,153,34,.09)}

.hintline{font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:3px}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">G</div>
    <h1>Github-search<em>GitHub 项目发现漏斗</em></h1>
  </div>
  <div class="sp"></div>
  <div class="badge" id="ghBadge"><span class="dot" id="ghDot"></span><span id="ghText">检测中…</span></div>
  <button id="btnApi">接入 API</button>
</header>

<main>
  <!-- 左栏 -->
  <section class="col" id="colLeft">
    <div class="colhead">
      <span id="leftTitle">新建查询</span><span class="sp"></span>
      <button class="ghost" id="btnBack" style="padding:3px 10px;font-size:10.5px" hidden>返回表单</button>
    </div>
    <div class="colbody">
      <div id="formView"><div class="pad">
        <!-- B2：点「返回表单」后，若仍有任务在跑，这里给一条回去的路。
             否则 S.runId 被清空、又没有任务列表，那个扫描就再也进不去、也停不掉，只能刷新页面。 -->
        <div id="resumeBar" hidden style="display:flex;align-items:center;gap:9px;margin-bottom:13px;            padding:9px 11px;border-radius:8px;border:1px solid rgba(63,185,80,.4);            background:rgba(63,185,80,.08)">
          <span class="dot on live" aria-hidden="true"></span>
          <span style="flex:1;font-size:11.5px;color:#7ee787" id="resumeText">任务在运行中</span>
          <button type="button" id="btnResume" style="padding:3px 10px;font-size:10.5px">回到日志</button>
        </div>
        <div class="f">
          <label for="kw">关键词 <span class="hint">搜索的种子</span></label>
          <textarea id="kw" placeholder="vector database, 向量检索, embedding store&#10;逗号或换行分隔 —— LLM 会把它扩写成一组 GitHub 搜索词"></textarea>
        </div>
        <div class="f">
          <label for="goal">查询目标 <span class="hint">打分与过滤的评判标准</span></label>
          <textarea id="goal" style="min-height:78px" placeholder="找能直接跑起来的开源向量数据库，支持增量写入和混合检索"></textarea>
        </div>
        <div class="fixed-note">
          <span class="lbl">默认</span> · 启用漏斗 · 展示 <b>20</b> 条 · 粗筛 <b>0.3</b> 入列 · 门槛 <b>0.7</b>
        </div>
        <button class="pri wide" id="btnStart">开始查询</button>
        <button type="button" class="adv-toggle" id="advToggle" aria-expanded="false" aria-controls="advBox"><span class="arw" aria-hidden="true">▶</span><span>高级选项</span></button>
        <div id="advBox">
          <div class="two">
            <div class="f"><label for="mode">模式</label><select id="mode">
              <option value="target">目标模式 · 凑够即停</option>
              <option value="auto">自动模式 · 持续搜</option></select></div>
            <div class="f"><label for="wantN">展示条数</label><input id="wantN" type="number" min="1" max="500" value="20"></div>
          </div>
          <div class="two">
            <div class="f"><label for="threshold">入列门槛</label><input id="threshold" type="number" step="0.05" min="0" max="1" value="0.7"></div>
            <div class="f"><label for="coarse">粗筛门槛</label><input id="coarse" type="number" step="0.05" min="0" max="1" value="0.3"></div>
          </div>
          <div class="two">
            <div class="f"><label for="conc">并发数</label><input id="conc" type="number" min="1" max="10" value="3"></div>
            <div class="f"><label for="lang">语言</label><input id="lang" placeholder="Python / 留空"></div>
          </div>
          <div class="two">
            <div class="f"><label for="minStars">最低 star</label><input id="minStars" type="number" min="0" value="0"></div>
            <div class="f"><label for="maxAge">最大未更新天数</label><input id="maxAge" type="number" min="0" value="0"></div>
          </div>
          <div class="f"><label for="funnel">漏斗</label><select id="funnel">
            <option value="1">启用 · 先粗筛再读 README</option>
            <option value="0">关闭 · 每个仓库都读 README</option></select></div>
        </div>
        <!-- 未配置 LLM 的常驻提示。独立元素，由 paintLLM 控制显隐 ——
             不借用 formMsg，否则表单校验错误和这条会互相覆盖 -->
        <div class="msg warn" id="llmWarn" hidden>还没接入 LLM API —— 点右上角「接入 API」填写 Base URL / 模型名 / Key。</div>
        <div class="msg" id="formMsg"></div>
      </div></div>

      <div id="logView">
        <div class="logbar">
          <span class="dot" id="logDot"></span>
          <span id="logStatus">—</span>
          <span style="flex:1"></span>
          <button class="danger" id="btnStop" style="padding:3px 11px;font-size:10.5px" disabled>停止</button>
        </div>
        <!-- B3：日志视图自己的提示槽。#formMsg 在 #formView 里，而日志视图下那个容器是
             display:none —— 停止失败的错误写进去用户根本看不见（第二轮审计实测 offsetParent=null）。
             所以运行相关的反馈必须放在这里。 -->
        <div class="msg" id="logMsg" style="margin:8px 12px 10px"></div>
        <div class="logbody" id="logBody"></div>
      </div>
    </div>
  </section>

  <!-- 中栏 -->
  <section class="col" id="colCenter">
    <div id="centerHead">
      <div id="runbar"></div>
      <div class="stats">
        <div class="stat"><b id="sQualified">0</b><span>已入列</span></div>
        <div class="stat"><b id="sScored">0</b><span>已打分</span></div>
        <div class="stat"><b id="sScanned">0</b><span>已扫描</span></div>
        <div class="stat"><b id="sKw">0</b><span>搜索词</span></div>
      </div>
      <div id="ghost">待命</div>
    </div>
    <div id="histWrap">
      <div class="hist" id="hist"></div>
      <div class="hlab" id="histLab"></div>
      <div class="histmeta" id="histMeta">暂无打分数据</div>
    </div>
    <div id="results">
      <div class="empty"><span class="ico">◎</span><b>还没有结果</b>在左侧填写关键词与查询目标，然后开始查询</div>
    </div>
  </section>

  <!-- 右栏 -->
  <section class="col" id="colRight">
    <div class="colhead">
      <span>关键词扩词</span><span class="sp"></span>
      <span id="kwCount" style="color:var(--faint);font-size:10px;text-transform:none;letter-spacing:0">0</span>
    </div>
    <div class="colbody" id="kwList">
      <div class="empty" style="padding:38px 18px;font-size:11.5px">暂无扩词</div>
    </div>
  </section>
</main>

<!-- 接入 API -->
<div class="mask" id="apiMask">
  <!--
    模态语义：role=dialog + aria-modal 让屏幕阅读器把焦点锁在这一层；
    aria-labelledby 指向标题文本，读出来是「接入 LLM API 对话框」。
    焦点管理（打开聚焦第一个输入 / Tab 循环 / Esc 关闭并回焦）在脚本里做。
  -->
  <div class="modal" id="apiModal" role="dialog" aria-modal="true" aria-labelledby="apiTitle">
    <h2><span class="ic" aria-hidden="true">⚡</span><span id="apiTitle">接入 LLM API</span><span class="sp"></span><button class="x" id="apiClose" aria-label="关闭">✕</button></h2>
    <div class="bd">
      <div class="f"><label for="llmBase">Base URL</label>
        <input id="llmBase" placeholder="https://api.deepseek.com/v1"></div>
      <div class="f"><label for="llmModel">模型名</label>
        <input id="llmModel" placeholder="deepseek-chat"></div>
      <div class="f"><label for="llmKey">API Key <span class="hint" id="keyHint"></span></label>
        <input id="llmKey" type="password" placeholder="sk-...">
        <div class="hintline">Key 会存在服务端 data/llm.json（权限 0600），GET 接口只回脱敏值。</div>
      </div>
      <div class="msg" id="apiMsg"></div>
    </div>
    <div class="ft">
      <button id="btnTest">测试连通</button>
      <span class="sp"></span>
      <button class="ghost" id="apiCancel">取消</button>
      <button class="pri" id="apiSave">保存</button>
    </div>
  </div>
</div>

<script>
/*
  前端脚本。没有框架、没有构建，全部原生 DOM 操作。
  因为整个页面只有一个视图状态机（表单 / 日志）和两种运行状态（跑 / 停），
  引入框架的收益抵不过它的体积与构建复杂度。

  组织顺序（自上而下即调用方向）：
    1. 状态与工具        唯一可变状态 S、$ / esc / api 三个工具函数
    2. 状态绘制          paintGitHub / paintLLM —— 把后端返回值映射成徽章
    3. 视图切换          showForm / showLog —— 左栏在表单与日志之间原地切换
    4. 渲染函数          renderStats/Hist/Results/Keywords/Log
                         每个都是「吃一个后端字段，吐一段 HTML 字符串」的纯函数
    5. 轮询              tick（全局 2 秒）/ pollRun（任务详情）
    6. 交互              按钮 onclick 全部集中在文件末尾
*/

/* 全局可变状态。刻意保持极小 —— 其余一切都从后端每 2 秒拉一次，
   不做前端缓存，避免「界面显示的进度和真实进度不一致」。 */
var S = {
  runId: null,
  running: false,      // 后端 status === "running"
  stopping: false,     // 后端 status === "stopping"
  active: false,       // running || stopping —— 只要是"还在进行中"就用它
  ended: false,        // done / stopped / failed
  status: "",          // 上一次拿到的 run.status，renderGhost 要按它选文案
  llmOk: false,
  ghOk: false,
  lastLlm: null,       // 最近一次后端返回的 LLM 配置，用于关闭弹窗时还原
  apiDirty: false,     // 用户在弹窗里改过东西 —— 期间禁止 tick 回写输入框
  suppressAdopt: false, // 用户主动点了「返回表单」，别被 tick 又拉回去
  starting: false,      // 正在 POST /api/runs —— 期间别让 tick 把按钮点亮（防双提交）
  saving: false,        // 正在保存 LLM 配置
  staleBefore: 0,       // 早于此时刻发出的 /api/state 响应一律作废（防旧值覆盖刚保存的配置）
  pollEpoch: 0          // 每次切走/换任务就自增；在途的旧轮询响应据此丢弃（防劫持）
};

function $(id){ return document.getElementById(id); }

/*
  HTML 转义。这个函数是【安全边界】，不是格式美化 —— 别删。
  仓库名、一句话介绍、URL 全部来自 GitHub 上的第三方内容，属于不可信输入。
  本项目用字符串拼 HTML（innerHTML），所以每个插值点都必须过一遍 esc()。
  用 split/join 而不是正则，是为了避免正则字面量在不同转义层里出错。
  注意 URL 也要转义：属性值里的引号闭合同样能注入。
*/
function esc(s){
  return String(s == null ? "" : s)
    .split("&").join("&amp;")
    .split("<").join("&lt;")
    .split(">").join("&gt;")
    .split('"').join("&quot;");
}
function api(p, o){
  return fetch(p, o).then(function(r){
    return r.json().catch(function(){ return { ok:false, error:"响应不是 JSON" }; });
  });
}
function num(v){ return (v === null || v === undefined || v === "") ? "0" : String(v); }

/*
  外链协议白名单。html_url 来自 GitHub，属于不可信输入。
  esc() 只能防 HTML 注入，防不住 href="javascript:..." —— 属性值本身是合法的，
  点击时才会执行。这里解析后只放行 http/https，其余一律退化成 #。
*/
function safeUrl(u){
  try {
    var x = new URL(String(u));
    if (x.protocol === "http:" || x.protocol === "https:") return x.href;
  } catch (e) { /* 不是合法 URL，落到下面返回 # */ }
  return "#";
}

/* ---------------- GitHub 状态 ---------------- */
function paintGitHub(g){
  var dot = $("ghDot"), txt = $("ghText"), bd = $("ghBadge");
  if (!g){ txt.textContent = "检测中…"; return; }
  if (g.configured){
    dot.className = "dot on";
    bd.className = "badge on";
    var extra = [];
    if (typeof g.searchTokens === "number") extra.push("搜索 " + g.searchTokens);
    if (typeof g.coreTokens === "number") extra.push("core " + g.coreTokens);
    txt.textContent = "GitHub 已连接" + (extra.length ? " · " + extra.join(" · ") : "");
    S.ghOk = true;
  } else {
    dot.className = "dot off";
    bd.className = "badge off";
    txt.textContent = "GitHub 未连接";
    S.ghOk = false;
  }
  bd.title = g.tokenSource || (g.configured ? "已认证" : "未配置 GITHUB_TOKEN");
}

/* ---------------- LLM 状态 ---------------- */
function paintLLM(l){
  if (!l) return;
  S.llmOk = !!l.configured;
  // B7：正在编辑或保存时，不要把可能陈旧的响应记成"已保存值"
  if (!S.apiDirty && !S.saving) S.lastLlm = l;

  /*
    【关键】只有用户没在编辑时才回写输入框。
    原来每 2 秒无条件写值，结果弹出窗里刚打完自定义 Base URL / 模型名，
    下一个 tick（2s 内）就被服务端的旧值覆盖回去 —— 自定义中转地址根本存不进去。
  */
  if (!S.apiDirty){
    $("llmBase").value = l.baseUrl || "";
    $("llmModel").value = l.model || "";
  }
  $("keyHint").textContent = l.apiKeyMasked ? "已保存 " + l.apiKeyMasked : "未保存";
  // 既有问题 2：正在提交时不能被 tick 重新点亮，否则慢响应期间会发第二个 POST
  $("btnStart").disabled = !l.configured || S.starting;

  /*
    未配置提示改用独立元素 #llmWarn，不再借用 formMsg。
    原来只 show 不 hide：保存成功后左侧黄色警告会一直挂着，和"开始查询"已点亮自相矛盾。

    【第二轮审计抓到的回归】只切 hidden 是不够的：.msg 的基础样式是 display:none，
    只有 .msg.on 才 display:block。所以 hidden=false 但元素仍然看不见 ——
    "永不隐藏"被我改成了"永不显示"。必须同时 toggle .on。
  */
  var warn = $("llmWarn");
  warn.hidden = !!l.configured;
  warn.classList.toggle("on", !l.configured);
}

function showMsg(id, cls, text){
  var e = $(id);
  e.className = "msg on " + cls;
  e.textContent = text;
}
function hideMsg(id){ $(id).className = "msg"; }

/* ---------------- 视图切换 ---------------- */
/*
  左栏在「表单」与「日志」之间原地切换，而不是弹新页面或新标签。
  理由：扫描一开始，用户最想看的是「它在干什么」；但也不能失去重新发起查询的能力。
  所以保留「返回表单」按钮，并且切回去时不清空输入框 —— 便于改个词再跑一次。
*/
function showForm(){
  $("formView").style.display = "block";
  $("logView").classList.remove("on");
  $("leftTitle").textContent = "新建查询";
  $("btnBack").hidden = true;
}
function showLog(){
  $("formView").style.display = "none";
  $("logView").classList.add("on");
  $("leftTitle").textContent = "运行日志";
  $("btnBack").hidden = false;
}

/* ---------------- 渲染 ---------------- */
function scoreClass(s){ return s >= 0.75 ? "s-hi" : (s >= 0.5 ? "s-mid" : "s-lo"); }

function renderStats(run){
  if (!run) return;
  $("sQualified").textContent = num(run.qualified);
  $("sScored").textContent = num(run.scored);
  $("sScanned").textContent = num(run.scanned);
}

function renderGhost(){
  var g = $("ghost");
  if (S.running){ g.textContent = "搜索中"; g.className = "live"; }
  else if (S.stopping){ g.textContent = "停止中"; g.className = "warn"; }
  else if (S.status === "done"){ g.textContent = "搜索完毕"; g.className = "done"; }
  else if (S.status === "failed"){ g.textContent = "搜索失败"; g.className = "fail"; }
  else if (S.status === "stopped"){ g.textContent = "已停止"; g.className = ""; }
  else { g.textContent = "待命"; g.className = ""; }
}

/*
  直方图。数据来自 /api/runs/:id 的 histogram，形状由 db.mjs:scoreHistogram 定义：
    { n, bins:number[10], min, max, mean, sd }
  min/max 在「一个都没评分」时是 null —— 必须判空，否则 toFixed 会抛异常。
  bins 的下标含义是「分数落在 [i/10, (i+1)/10)」，所以标签直接用 i/n。
  第 7 格起（>=0.7）涂成绿色，和后端默认入列门槛 0.7 对齐 ——
  让用户一眼看到「有多少条够得着门槛」。
*/
function renderHist(hist){
  var wrap = $("hist"), lab = $("histLab"), meta = $("histMeta");
  if (!hist || !hist.bins || !hist.bins.length){
    wrap.innerHTML = ""; lab.innerHTML = "";
    meta.innerHTML = "暂无打分数据";
    return;
  }
  var bins = hist.bins, n = bins.length;
  var max = 0, i;
  for (i = 0; i < n; i++) if (bins[i] > max) max = bins[i];
  if (max <= 0) max = 1;
  var h = "", lb = "";
  for (i = 0; i < n; i++){
    var pct = Math.round((bins[i] / max) * 100);
    var lo = (i / n).toFixed(1);
    var cls = bins[i] === 0 ? "hbar zero" : ((i / n) >= 0.7 ? "hbar hot" : "hbar");
    h += '<div class="hcol"><div class="hcnt">' + (bins[i] || "") + '</div>'
       + '<div class="' + cls + '" style="height:' + Math.max(2, pct) + '%"></div></div>';
    lb += '<span>' + lo + '</span>';
  }
  wrap.innerHTML = h;
  lab.innerHTML = lb;
  /*
    数值一律先 Number() + isFinite 再格式化。原来直接 hist.mean.toFixed()，
    一旦 JSON 里出现字符串（类型漂移、外部注入、未来换存储），整块直方图会抛
    TypeError 直接不渲染。现在最坏情况只是少显示一个统计数字。
  */
  var f2 = function(v){
    var n = Number(v);
    return Number.isFinite(n) ? n.toFixed(2) : null;
  };
  var m = '已评分 <b>' + num(hist.n) + '</b>';
  var mn = f2(hist.mean), sd = f2(hist.sd), lo = f2(hist.min), hi = f2(hist.max);
  if (mn !== null) m += ' · 均值 <b>' + mn + '</b>';
  if (sd !== null) m += ' · 标准差 <b>' + sd + '</b>';
  if (lo !== null && hi !== null){
    m += ' · 区间 <b class="g">' + lo + ' ~ ' + hi + '</b>';
  }
  meta.innerHTML = m;
}

/*
  结果列表。rows 来自 /api/results，是 hits 表的行：
    { full_name, html_url, score, one_line, stars, lang, pushed, descr, topics }
  这里只用前七个。score 是 0~1 的小数，按 .75 / .5 两档染色。
  运行中且暂无结果时显示「正在搜索…」而不是空白 —— 空态会让人以为已结束。
*/
function renderResults(rows){
  var box = $("results");
  if (!rows || !rows.length){
    /* B5：用 S.active 而不是 S.running —— 停止中也不该显示「还没有结果，去填表」的闲置文案 */
    var _tip = S.running
      ? '<div class="empty"><span class="ico">⌛</span><b>正在搜索…</b>还没有达标的项目<br><span style="font-size:11px;color:var(--faint)">达标项目会在这里逐个出现</span></div>'
      : (S.stopping
        ? '<div class="empty"><span class="ico">⏸</span><b>正在停止…</b>已发出的请求会跑完</div>'
        : '<div class="empty"><span class="ico">◎</span><b>还没有结果</b>在左侧填写关键词与查询目标，然后开始查询</div>');
    box.innerHTML = _tip;
    return;
  }
  var h = "", i, r, sc;
  for (i = 0; i < rows.length; i++){
    r = rows[i]; sc = Number(r.score);
    h += '<div class="hit">'
       +   '<div class="rank">' + (i + 1) + '</div>'
       +   '<div class="sc ' + scoreClass(sc) + '">' + sc.toFixed(2) + '</div>'
       +   '<div class="body">'
       +     '<div class="name"><a href="' + esc(safeUrl(r.html_url)) + '" target="_blank" rel="noreferrer noopener">' + esc(r.full_name) + '</a></div>'
       +     '<div class="one">' + esc(r.one_line) + '</div>'
       +     '<div class="meta">'
       +       '<i class="star">★ ' + (r.stars || 0) + '</i>'
       +       (r.lang ? '<i>' + esc(r.lang) + '</i>' : '')
       +       (r.pushed ? '<i>更新 ' + esc(String(r.pushed).slice(0, 10)) + '</i>' : '')
       +     '</div>'
       +   '</div>'
       + '</div>';
  }
  box.innerHTML = h;
}

/*
  关键词扩词。kws 来自 /api/runs/:id 的 keywords，即 frontier 表的行：
    { q, page, origin, depth, hits, dry, total_count, retired }

  depth 是扩词轮次：1=初始扩写，2/3=带着前半程结果再要的新角度。
  origin 说明这个词是谁给的：user（用户输入）/ llm-d1..d3（LLM 生成）。
  dry>0 表示这个词搜出来全是见过的仓库、没有新结果 —— 划掉并标「无新结果」，
      这不是失败，是「这条路已经挖干净了」，所以用弱化色而不是红色。
  retired 表示已退出前沿队列（不再翻页）。
*/
function renderKeywords(kws){
  var box = $("kwList");
  if (!kws || !kws.length){
    box.innerHTML = '<div class="empty" style="padding:38px 18px;font-size:11.5px">暂无扩词</div>';
    $("kwCount").textContent = "0";
    $("sKw").textContent = "0";
    return;
  }
  $("kwCount").textContent = kws.length;
  $("sKw").textContent = kws.length;
  var h = "", i, k, dry, d, tag;
  for (i = 0; i < kws.length; i++){
    k = kws[i];
    dry = Number(k.dry) > 0;
    d = Number(k.depth || 0);
    tag = d <= 1 ? "d1" : (d === 2 ? "d2" : "d3");
    h += '<div class="kwi' + (dry ? ' dry' : '') + '">'
       +   '<div class="q">' + esc(k.q) + '</div>'
       +   '<div class="row2">'
       +     '<span class="tag ' + tag + '">L' + d + '</span>'
       +     (k.origin ? '<span class="tag ' + (String(k.origin).toLowerCase() === "user" ? "src-user" : "src-llm") + '">' + esc(k.origin) + '</span>' : '')
       +     '<span>命中 ' + (k.hits || 0) + '</span>'
       +     (k.total_count ? '<span>共 ' + k.total_count + '</span>' : '')
       +     (k.retired ? '<span class="tag retired">已退休</span>' : '')
       +   '</div>'
       + '</div>';
  }
  box.innerHTML = h;
}

function renderLog(lines){
  var box = $("logBody");
  if (!lines || !lines.length){ box.innerHTML = ""; return; }
  var h = "", i, t, cls, i2;
  for (i = 0; i < lines.length; i++){
    t = String(lines[i]).replace(/\s+$/, "");
    if (!t) continue;
    cls = "logline";
    if (/ERROR|失败|异常|错误|拒绝|未达标/.test(t)) cls += " err";
    else if (/超时|重试|警告|上限/.test(t)) cls += " warn";
    else if (/达标|入列|新建任务|搬入|完成/.test(t)) cls += " hi";
    else if (/扩词|query|搜索词/i.test(t)) cls += " kw";
    h += '<div class="' + cls + '">' + esc(t) + '</div>';
  }
  /*
    只在「用户原本就在底部」时才自动滚到底。
    原来每次渲染都强设 scrollTop=scrollHeight，于是每 2 秒把往上翻的人拽回底部，
    历史日志根本没法回看（实测把它设成 0，2.5 秒后又变回 3069）。
  */
  var atBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 8;
  box.innerHTML = h;
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* ---------------- 轮询 ---------------- */
/*
  任务状态 → 视觉。全站的状态色只在这里决定，别处不要再写死颜色。
    运行中   绿点 + 呼吸动画 + 顶部流光条
    已完成   绿点常亮（不再呼吸）
    失败     红点
    已停止   灰点
  「running」以后端为准（run.status），本地 S.running 只是缓存 ——
  否则用户切走标签页再回来，界面会以为自己还在跑。
*/
function setRunState(run, running){
  if (!run) return;
  var st = run.status;

  /*
    【关键】运行态只看 run.status，不看后端返回的 running 字段。
    server.mjs 的 /api/runs/:id 里 running = children.has(id)，语义是
    「本进程有没有这个扫描子进程的 stdout 句柄」——服务重启后被接管的任务
    状态仍是 running 但没有句柄，值为 false。用它驱动 UI 会让正在跑的任务
    显示成灰点+待命+停止按钮禁用，长跑任务根本没法从界面停。
  */
  /*
    【第三轮盲审后回退】这里【不能】写 S.runId。
    上一轮为了修 resumeBar 指错任务加了一行 S.runId = run.id，结果引入了更严重的问题：
    「返回表单」之后，一个【在途的】旧 /api/runs/:id 响应到达时会把 S.runId 复活，
    中央区复位被撤销；更糟的是若用户此时新建了任务 #43，旧响应会把界面劫持回 #42，
    点"停止"停的是 42 而不是用户以为的 43。
    现在 runId 只由 adopt / btnStart / btnResume 三处显式赋值，并配合 pollEpoch 丢弃陈旧响应。
  */
  S.status = st;
  S.running = (st === "running");
  S.stopping = (st === "stopping");
  S.active = S.running || S.stopping;
  S.ended = (st === "done" || st === "stopped" || st === "failed");

  renderStats(run);
  renderGhost();
  $("runbar").className = S.active ? "on" : "";

  var d = $("logDot");
  if (S.running) d.className = "dot on live";
  else if (S.stopping) d.className = "dot warn live";
  else if (st === "done") d.className = "dot on";
  else if (st === "failed") d.className = "dot off";
  else d.className = "dot";

  var st = run.status === "running" ? "运行中"
         : run.status === "stopping" ? "停止中"
         : run.status === "done" ? "已完成"
         : run.status === "stopped" ? "已停止"
         : run.status === "failed" ? "失败"
         : (run.status || "—");
  $("logStatus").textContent = "任务 #" + run.id + " · " + st
    + (run.stop_reason ? " · " + run.stop_reason : "");
    /*
    B4：只在真正 running 时可点。stopping 说明用户已经请求过停止，
    再点一次只会重复 POST /stop。原来写成 !S.active，而 S.active 包含 stopping，
    于是状态一变 stopping，按钮又被点亮 —— 注释和代码自相矛盾。
  */
  $("btnStop").disabled = !S.running;
}

/*
  第一级轮询：只拉全局状态（LLM 配置、GitHub 额度、最近任务列表）。
  顺手做一件重要的事：如果 URL 里没有任务、但后端有正在跑的任务，就自动接管它。
  这样刷新页面或换设备打开，都能直接看到正在进行的扫描，而不是回到空表单。
*/
function tick(){
  var t0 = Date.now();   // 记下发请求的时刻，用于判定响应是否已经过期
  api("/api/state").then(function(st){
    if (!st || !st.ok) return;
    paintGitHub(st.github);
    /*
      B7：保存配置之后，可能还有若干个「保存之前发出」的 /api/state 响应在飞。
      它们带的是旧配置，落到 paintLLM 就会把刚保存的新值盖回去，直到下个 tick 才恢复。
      用发请求时刻与 staleBefore 比较即可丢弃。
    */
    if (t0 >= S.staleBefore) paintLLM(st.llm);

    /*
      修 4：resumeBar 只在「返回表单」那一刻写过文案，之后从不更新。
      于是任务已经结束/被停，它还一直写着"仍在运行（未停止）"（第三轮盲审实测）。
      这里每次 tick 用 st.runs 按 data-run 核对一次真实状态。
    */
    var bar = $("resumeBar");
    var barId = Number(bar.getAttribute("data-run") || 0);
    if (!bar.hidden && barId){
      var found = null, rr = st.runs || [];
      for (var ri = 0; ri < rr.length; ri++){
        if (Number(rr[ri].id) === barId){ found = rr[ri]; break; }
      }
      var barSt = found ? found.status : "";
      if (barSt === "running"){
        $("resumeText").textContent = "任务 #" + barId + " 仍在运行（未停止）";
        bar.style.borderColor = "rgba(63,185,80,.4)";
        bar.style.background = "rgba(63,185,80,.08)";
        $("resumeText").style.color = "#7ee787";
        $("btnResume").textContent = "回到日志";
      } else if (barSt === "stopping"){
        $("resumeText").textContent = "任务 #" + barId + " 正在停止…";
        bar.style.borderColor = "rgba(210,153,34,.4)";
        bar.style.background = "rgba(210,153,34,.08)";
        $("resumeText").style.color = "#e3b341";
        $("btnResume").textContent = "查看";
      } else if (barSt === "done" || barSt === "failed" || barSt === "stopped"){
        var label = barSt === "done" ? "已完成" : (barSt === "failed" ? "失败" : "已停止");
        $("resumeText").textContent = "任务 #" + barId + " " + label + "（点查看日志）";
        bar.style.borderColor = "var(--line2)";
        bar.style.background = "rgba(28,37,51,.55)";
        $("resumeText").style.color = "var(--muted)";
        $("btnResume").textContent = "查看日志";
      }
      // 找不到（被清理了）就保持原样，让用户还能点进去看错误
    }
    /*
      自动接管正在跑的任务 —— 但【只在用户没主动退出时】。
      原来无条件下，点「返回表单」后 2 秒就被拉回日志，那个按钮等于没用。
      suppressAdopt 由 btnBack 置真，由 btnStart 或手动选中任务置假。
    */
    if (!S.runId && !S.suppressAdopt){
      var runs = st.runs || [], i, live = null;
      for (i = 0; i < runs.length; i++){
        if (runs[i].status === "running" || runs[i].status === "stopping"){ live = runs[i]; break; }
      }
      if (live){ S.runId = live.id; showLog(); }
    }
    if (S.runId) pollRun();
  }).catch(function(){});
}

/*
  第二级轮询：任务详情（日志 / 扩词 / 直方图）+ 结果行。

  两次请求是【串行】的（第二个 .then 里才发 /api/results），原因：
    1. run 详情里带 run 状态，先拿到它才知道要不要继续拉结果；
    2. 并发两个请求会让「先到的旧结果覆盖后到的新状态」。
  本地 SQLite，两个请求都是毫秒级，串行的代价可以忽略。
*/
function pollRun(){
  var id = S.runId;
  if (!id) return;
  /*
    epoch 守卫：两段 then 都要先确认"现在我还在看同一个任务"。
    场景：/api/runs/42 延迟 2 秒，用户已经点了返回表单并新建 #43 ——
    旧响应到达时若不校验，就会把界面、日志、S.runId 全劫持回 42。
  */
  var ep = S.pollEpoch;
  var fresh = function(){ return ep === S.pollEpoch && S.runId === id; };

  api("/api/runs/" + id).then(function(d){
    if (!fresh()) return null;
    if (!d || !d.ok) return null;
    setRunState(d.run, d.running);
    renderKeywords(d.keywords);
    renderHist(d.histogram);
    renderLog(d.log);
    return api("/api/results?run=" + id + "&limit=200").then(function(res){
      if (!fresh()) return;          // 结果这次请求也可能慢，同样要再校验一次
      if (res && res.ok){
        renderResults(res.rows);
        if (res.run) setRunState(res.run, S.running);
      }
    });
  }).catch(function(){});
}

/* ---------------- 交互 ---------------- */
$("advToggle").onclick = function(){
  var open = this.classList.toggle("open");
  $("advBox").classList.toggle("open");
  // B6：aria-expanded 必须跟着变，否则屏幕阅读器永远读「已折叠」
  this.setAttribute("aria-expanded", String(open));
};

/*
  开始查询。表单默认值刻意固定为：启用漏斗 / 展示 20 条 / 粗筛 0.3 / 入列门槛 0.7。
  这四个不出现在首屏表单里，只显示一行「默认」提示 —— 它们收在「高级选项」中，
  因为绝大多数时候不该需要调；但用户想调时必须能调。

  提交成功后【不关闭左栏表单】，而是切到日志视图 —— 让用户立刻看到第一行输出，
  这比任何 toast 都更能说明「真的跑起来了」。
*/
$("btnStart").onclick = function(){
  var kw = $("kw").value.trim();
  var goal = $("goal").value.trim();
  hideMsg("formMsg");
  if (!kw){ showMsg("formMsg", "bad", "关键词不能为空。"); return; }
  if (!goal){ showMsg("formMsg", "bad", "查询目标不能为空。"); return; }
  var body = {
    keywords: kw, goal: goal,
    mode: $("mode").value,
    wantN: Number($("wantN").value) || 20,
    threshold: Number($("threshold").value),
    coarseThreshold: Number($("coarse").value),
    funnel: $("funnel").value === "1",
    concurrency: Number($("conc").value) || 3,
    lang: $("lang").value.trim(),
    minStars: Number($("minStars").value) || 0,
    maxAgeDays: Number($("maxAge").value) || 0
  };
  var btn = this;
  S.starting = true;              // 防双提交：tick 里的 paintLLM 会尊重这个标志
  btn.disabled = true; btn.textContent = "启动中…";
  api("/api/runs", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function(r){
    S.starting = false;
    btn.disabled = false; btn.textContent = "开始查询";
    if (!r || !r.ok){
      showMsg("formMsg", "bad", (r && r.error) || "创建任务失败");
      return;
    }
    S.runId = r.run.id;
    S.pollEpoch++;                 // 丢弃上一个任务在途的轮询响应（防劫持新任务）
    S.suppressAdopt = false;
    $("resumeBar").hidden = true;
    S.running = true; S.ended = false;
    showLog();
    $("logBody").innerHTML = "";
    pollRun();
  }).catch(function(e){
    S.starting = false;
    btn.disabled = false; btn.textContent = "开始查询";
    showMsg("formMsg", "bad", "请求失败：" + e.message);
  });
};

$("btnResume").onclick = function(){
  var id = Number(this.parentNode.getAttribute("data-run") || 0);
  if (!id) return;
  S.suppressAdopt = false;
  S.runId = id;
  S.pollEpoch++;
  this.parentNode.hidden = true;
  showLog();
  pollRun();
};

$("btnStop").onclick = function(){
  if (!S.runId) return;
  var btn = this;
  btn.disabled = true;
  hideMsg("formMsg");
  api("/api/runs/" + S.runId + "/stop", { method: "POST" }).then(function(r){
    if (r && r.ok){ hideMsg("logMsg"); pollRun(); return; }
    // 停止失败必须说出来，而且要写在【日志视图看得见的地方】
    btn.disabled = false;
    showMsg("logMsg", "bad", "停止失败：" + ((r && r.error) || "服务端返回失败"));
  }).catch(function(e){
    btn.disabled = false;
    showMsg("logMsg", "bad", "停止请求失败：" + e.message);
  });
};

$("btnBack").onclick = function(){
  /*
    B2：不能只清 runId 就走人 —— 那样中央区会残留上一个任务的状态：
    流光条还在跑、统计还是旧数字、结果区还写着「正在搜索…」，而大字已经变成「待命」，
    自相矛盾。这里把运行视图整体复位，同时保留一条 resumeBar 让人能回去。
  */
  var stillRunning = S.running || S.stopping;
  var keepId = S.runId;

  S.runId = null;
  S.pollEpoch++;                 // 作废所有在途轮询，否则旧响应会把 S.runId 复活
  S.running = false; S.stopping = false; S.active = false; S.ended = false; S.status = "";
  S.suppressAdopt = true;      // 直到用户新建任务或点 resume，否则 tick 别再拉我回去

  showForm();
  $("logBody").innerHTML = "";
  hideMsg("logMsg");
  $("runbar").className = "";
  $("logDot").className = "dot";
  $("logStatus").textContent = "—";
  $("btnStop").disabled = true;
  renderStats({ qualified: 0, scored: 0, scanned: 0 });
  renderHist(null);
  renderResults([]);
  renderKeywords([]);
  renderGhost();

  // 任务还在跑就留一条回去的路
  if (stillRunning && keepId){
    $("resumeText").textContent = "任务 #" + keepId + " 仍在运行（未停止）";
    $("resumeBar").hidden = false;
    $("resumeBar").setAttribute("data-run", String(keepId));
  } else {
    $("resumeBar").hidden = true;
    $("resumeBar").removeAttribute("data-run");
  }
};

/* ---------------- 接入 API ---------------- */
/*
  为什么单独做成弹窗而不是放进表单：
    LLM 配置是一次性设置，而关键词/查询目标每轮都改。混在一起会让每次查询都被迫
    扫过一堆不相关的字段。放在右上角，符合「配置」与「操作」分离的直觉。

  「测试连通」会在服务端真实发一次最小请求（POST /api/llm/test），
  而不是只校验字段格式 —— 地址写错、key 失效、模型名不存在，只有真打一次才知道。
  测试前会先把当前填的值 POST 到 /api/llm 覆盖内存配置，否则测的是旧配置。
*/
$("btnApi").onclick = function(){
  $("apiMask").classList.add("on");
  S.apiDirty = false;
  hideMsg("apiMsg");
  /*
    修 3：这里原来自己发一个 /api/state 且没有 staleBefore 守卫。
    如果它比保存动作更早发出、却更晚返回，就会把刚保存的配置覆盖回旧的
    （第三轮盲审实测：字段、keyHint、警告、按钮状态全部回退）。
    改为复用 tick() —— 那条路径已经有 staleBefore 与 apiDirty 双重守卫。
  */
  tick();
  // 焦点移进弹窗，否则 Tab 会先走背景表单（无障碍审计提的焦点管理问题）
  setTimeout(function(){ $("llmBase").focus(); $("llmBase").select(); }, 30);
};
function closeApi(){
  $("apiMask").classList.remove("on");
  /*
    必须在关闭时清空 Key 输入框。原来只有"保存成功"才清，点取消/✕ 后
    重新打开弹窗，上一次敲进去的明文 secret 还躺在 DOM 里 —— 屏幕共享或
    截图就漏了。Base/模型也要还原成服务端已保存值，撤掉被放弃的编辑。
  */
  $("llmKey").value = "";
  S.apiDirty = false;
  S.saving = false;
  // B7：不再拿 S.lastLlm 回写（那份可能是陈旧响应记下的），直接向服务端要一次真值
  $("btnApi").focus();      // 焦点回到触发按钮，键盘用户不会迷失
  tick();
}
$("apiClose").onclick = closeApi;
$("apiCancel").onclick = closeApi;
$("apiMask").onclick = function(e){ if (e.target === this) closeApi(); };

/* 一旦用户开始改输入框，就停掉 tick 的回写（见 paintLLM 里的 apiDirty 判断） */
["llmBase","llmModel","llmKey"].forEach(function(id){
  $(id).addEventListener("input", function(){ S.apiDirty = true; });
});

/*
  Esc 关闭 + Tab 焦点陷阱。
  没有这两样，键盘用户打开弹窗后会被卡住：Esc 无效，Tab 会跑到背后的表单里，
  视觉上在被遮罩盖住的区域乱跳。
*/
document.addEventListener("keydown", function(e){
  if (!$("apiMask").classList.contains("on")) return;
  if (e.key === "Escape"){ e.preventDefault(); closeApi(); return; }
  if (e.key !== "Tab") return;
  var f = $("apiModal").querySelectorAll("input,button,select,textarea,a[href]");
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

$("btnTest").onclick = function(){
  var btn = this;
  btn.disabled = true; btn.textContent = "测试中…";
  showMsg("apiMsg", "info", "正在用当前配置发一次真实请求…");
  /*
    修 1：直接把当前表单里的配置发给 /api/llm/test，由服务端用【临时 LlmClient】发一次真实请求。
    不再先 POST /api/llm ——
      之前那版会 saveJson 落盘（测试失败也留下坏配置）；
      上一轮改成 dryRun 后仍然污染了全局 llm 内存（界面说"已接入"、扫描却读磁盘的旧配置）。
    现在测试不碰任何持久化状态，也不碰全局实例。
  */
  var payload = { baseUrl: $("llmBase").value.trim(), model: $("llmModel").value.trim() };
  var k = $("llmKey").value.trim();
  if (k) payload.apiKey = k;
  api("/api/llm/test", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
  }).then(function(t){
    btn.disabled = false; btn.textContent = "测试连通";
    if (t && t.ok) showMsg("apiMsg", "ok", "连通成功 · " + t.ms + "ms · 模型 " + (t.model || "?"));
    else showMsg("apiMsg", "bad", "失败：" + ((t && t.error) || "未知错误"));
  }).catch(function(e){
    btn.disabled = false; btn.textContent = "测试连通";
    showMsg("apiMsg", "bad", "请求失败：" + e.message);
  });
};

$("apiSave").onclick = function(){
  var btn = this;
  btn.disabled = true;
  var payload = { baseUrl: $("llmBase").value.trim(), model: $("llmModel").value.trim() };
  var k = $("llmKey").value.trim();
  if (k) payload.apiKey = k;
  api("/api/llm", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
  }).then(function(r){
    btn.disabled = false;
    if (r && r.ok){
      // B7：此刻之前发出的 /api/state 响应都作废，否则会把新值盖回旧的
      S.staleBefore = Date.now();
      S.apiDirty = false;
      showMsg("apiMsg", "ok", "已保存。");
      paintLLM(r.llm);          // 用 POST 返回的新配置，不用缓存
      $("llmKey").value = "";
      setTimeout(closeApi, 800);
    } else {
      showMsg("apiMsg", "bad", (r && r.error) || "保存失败");
    }
  }).catch(function(e){
    btn.disabled = false;
    showMsg("apiMsg", "bad", "请求失败：" + e.message);
  });
};

/* ---------------- 启动 ---------------- */
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
